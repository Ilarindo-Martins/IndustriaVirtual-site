<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Indústria Virtual</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <script type="module" crossorigin src="./assets/index-cZN57fze.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BDbIhlrP.css">
</head>
<body>
<canvas id="app-canvas"></canvas>
<div id="labels"></div>
<div id="fade"></div>

<div id="hud">
    <div id="status" class="panel">
        <div class="rank"><span id="rank-icon">🦺</span><div><div id="rank-name" data-i18n="hud.role"></div><div id="xp-text" data-i18n="hud.plant"></div></div></div>
        <div id="location">—</div>
    </div>

    <canvas id="minimap" width="180" height="180"></canvas>

    <div id="badge" class="hidden">
        <div class="badge-strap"></div>
        <div class="badge-card">
            <div class="badge-clip"></div>
            <div class="badge-head">
                <span class="badge-logo">🏭</span>
                <span class="badge-org" id="badge-org"></span>
            </div>
            <div class="badge-photo" id="badge-photo"></div>
            <div class="badge-name" id="badge-name"></div>
            <div class="badge-role" id="badge-role"></div>
            <div class="badge-id" id="badge-id"></div>
            <div class="badge-foot" id="badge-foot"></div>
            <button id="badge-close" class="btn"><span data-i18n="badge.close"></span> <kbd data-i18n="badge.closeKey"></kbd></button>
        </div>
    </div>

    <div id="mission" class="panel hidden" aria-live="polite">
        <div id="mission-title"></div>
        <ul id="mission-steps"></ul>
    </div>

    <div id="missions-menu" class="hidden">
        <div class="im-card">
            <div class="im-head"><span data-i18n="missionsUi.menuTitle"></span> <kbd>M</kbd><button id="mm-close" class="im-close" data-i18n="missionsUi.close"></button></div>
            <p class="im-hint" data-i18n="missionsUi.menuHint"></p>
            <div id="mm-list"></div>
        </div>
    </div>
    <button id="btn-missions" class="btn" data-i18n-aria="missionsUi.menuTitle"><span data-i18n="missionsUi.short"></span> <kbd>M</kbd></button>

    <div id="report" class="hidden"><div class="report-card" id="report-card" role="dialog" aria-modal="true"></div></div>

    <div id="ppe" class="hidden">
        <div class="im-card ppe-card">
            <div class="im-head"><span data-i18n="safety.cabinet"></span><button id="ppe-close" class="im-close" data-i18n="missionsUi.close"></button></div>
            <p class="im-hint" data-i18n="safety.cabinetHint"></p>
            <div id="ppe-list"></div>
        </div>
    </div>

    <div id="alarm-banner" class="hidden" role="alert" data-i18n="missionsUi.alarm"></div>

    <div id="prompt" class="hidden"><kbd>E</kbd> <span id="prompt-text"></span></div>

    <div id="dialogue" class="panel hidden" role="dialog" aria-live="polite">
        <div class="speaker"><span id="dlg-name"></span><span id="dlg-role"></span></div>
        <p id="dlg-text"></p>
        <div id="dlg-options"></div>
    </div>

    <div id="toasts" role="status" aria-live="polite"></div>

    <div id="help" class="panel">
        <b data-i18n="help.title"></b>
        <div data-i18n-html="help.walk"></div>
        <div data-i18n-html="help.talk"></div>
        <div data-i18n-html="help.missions"></div>
        <div data-i18n-html="help.camera"></div>
        <div data-i18n-html="help.drag"></div>
        <div data-i18n-html="help.quality"></div>
        <div data-i18n-html="help.help"></div>
    </div>

    <div id="touch" class="hidden">
        <div id="joy-base"><div id="joy-knob"></div></div>
        <div id="touch-buttons">
            <button class="tbtn" id="t-rot-l">⟲</button>
            <button class="tbtn" id="t-rot-r">⟳</button>
            <button class="tbtn" id="t-mis" data-i18n-aria="missionsUi.menuTitle">M</button>
            <button class="tbtn big" id="t-act">E</button>
        </div>
    </div>
</div>

<div id="intro">
    <div class="stage">
    <img class="cover" data-i18n-alt="cover.alt" width="1672" height="941" decoding="async">
    <div class="intro-card">
        <div class="intro-badge">🏭</div>
        <h1 data-i18n="login.game"></h1>
        <h2 data-i18n="login.city"></h2>
        <p data-i18n="intro.text"></p>
        <p class="tip" data-i18n-html="intro.tip"></p>
        <div class="intro-actions">
            <button id="start" class="btn primary big" data-i18n="intro.start"></button>
            <select id="intro-lang" class="lang-select" data-i18n-aria="language.label"></select>
        </div>
        <div id="loading" data-i18n="intro.loading"></div>
    </div>
    </div>
</div>

<div id="login">
    <div class="stage">
    <img class="cover" data-i18n-alt="cover.alt" width="1672" height="941" decoding="async">
    <form id="login-form" class="login-card" autocomplete="on">
        <div class="gate-stripe" aria-hidden="true"></div>
        <div class="gate-head">
            <span class="gate-icon" aria-hidden="true">🦺</span>
            <span class="gate-title" data-i18n="login.title"></span>
            <span class="gate-channel" data-i18n="login.channel"></span>
            <select id="login-lang" class="lang-select" data-i18n-aria="language.label"></select>
        </div>
        <div class="login-body">
            <div class="intro-badge">🏭</div>
            <h1 data-i18n="login.game"></h1>
            <h2 data-i18n="login.city"></h2>
            <p class="login-hint" data-i18n="login.hint"></p>
            <label for="login-user" data-i18n="login.user"></label>
            <input id="login-user" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="32">
            <label for="login-pass" data-i18n="login.pass"></label>
            <div class="login-passrow">
                <input id="login-pass" name="password" type="password" autocomplete="current-password" maxlength="64">
                <button type="button" id="login-eye" class="btn" aria-pressed="false" data-i18n="login.show"></button>
            </div>
            <div id="login-msg" role="alert" aria-live="polite"></div>
            <button id="login-go" type="submit" class="btn primary big" data-i18n="login.enter"></button>
        </div>
    </form>
    </div>
</div>

</body>
</html>
